name: Refresh results

# Pulls live status + final scores and writes data/results.json — which drives the
# FT scores, LIVE badges, ✓/✗ verdicts and the auto-computed World Cup win rate.
# No wallet needed; needs a results-provider token (default football-data.org).
#
# Set repo secret FOOTBALL_DATA_TOKEN (free at https://www.football-data.org/).

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/30 * * * *"   # every 30 min during match days — enable for the tournament

permissions:
  contents: write
concurrency:
  group: refresh-results
  cancel-in-progress: true

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-results.mjs
      - name: Commit & push if changed
        run: |
          git config user.name  "franklin-bet-bot"
          git config user.email "bot@franklin.bet"
          if ! git diff --quiet -- data/results.json; then
            git add data/results.json
            git commit -m "chore: refresh match results"
            git push
          else
            echo "No result changes."
          fi
