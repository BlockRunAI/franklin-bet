name: Refresh results

# Pulls live status + final scores and writes data/results.json — which drives the
# FT scores, LIVE badges, ✓/✗ verdicts and the auto-computed World Cup win rate.
# Source: TheSportsDB (free, keyless) — no wallet, no secret needed.
# The site reads data/*.json from the repo's raw URL, so a push here goes live
# within minutes WITHOUT redeploying the container.
#
# The World Cup is complete, so automatic polling is intentionally disabled.
# Keep workflow_dispatch available for a one-off manual correction if needed.

on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: refresh-results
  cancel-in-progress: true

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch results
        run: node scripts/fetch-results.mjs
      - name: Commit & push if changed
        run: |
          git config user.name  "franklin-bet-bot"
          git config user.email "bot@franklin.bet"
          if ! git diff --quiet -- data/results.json; then
            git add data/results.json
            git commit -m "chore: refresh match results"
            git push
          else
            echo "No result changes."
          fi
